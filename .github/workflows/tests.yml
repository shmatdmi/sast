name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - name: Source module coverage
        run: npm run test:coverage > coverage.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.txt
